[package]
name = "xenora-metal"
description = "Bounded native Metal execution for Xenora graphics fixtures"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
gpu-tests = []

[[test]]
name = "native_compute"
path = "tests/native_compute.rs"
required-features = ["gpu-tests"]

[[test]]
name = "sampler_texture"
path = "tests/sampler_texture.rs"

[dev-dependencies]
xenora-ref = { path = "../ref" }

[dependencies]
xenora-shader = { path = "../shader" }

[target.'cfg(all(target_arch = "aarch64", target_os = "macos"))'.dependencies]
xenora-texture = { path = "../texture" }
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSError", "NSString", "NSRange"] }
objc2-metal = { version = "=0.3.2", default-features = false, features = [
    "std",
    "MTLAllocation",
    "MTLArgument",
    "MTLBuffer",
    "MTLBlitCommandEncoder",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLComputeCommandEncoder",
    "MTLComputePipeline",
    "MTLDepthStencil",
    "MTLDevice",
    "MTLEvent",
    "MTLLibrary",
    "MTLPixelFormat",
    "MTLPipeline",
    "MTLRenderCommandEncoder",
    "MTLRenderPass",
    "MTLRenderPipeline",
    "MTLResource",
    "MTLSampler",
    "MTLTexture",
    "MTLTypes",
    "objc2-core-foundation",
] }
