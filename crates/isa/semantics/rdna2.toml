# ---- VOP2 32-bit vector integer forms (#215) ----
# Per lane under EXEC; no SCC, VCC or EXEC write (guide 12.7). The 24-bit
# multiplies read S0[23:0] and S1[23:0], sign-extended when signed; the high
# forms keep bits 63:32 of the product. SUBREV declares its reversed sources.

[operand_rules.vop2_vgpr]
family = "VOP2"
dst = { field = "VDST", class = "vgpr", min = 0, max = 255 }
src = [
  { field = "SRC0", class = "vector_source" },
  { field = "VSRC1", class = "vgpr" },
]
# vector_source = VGPR, normal SGPR s0-s105, vcc_lo, inline integer -16..64, or a literal word.
max_literals = 1
unsupported = [
  "src_vcc_hi", "src_exec", "src_m0", "src_ttmp", "src_null", "src_float_inline", "src_special",
]

